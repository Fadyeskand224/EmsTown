# Render Blueprint: Ems Town is a pure static site (no server, no database, no secrets).
services:
  - type: web
    name: emstown
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
